server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 40m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        proxy_pass http://gvpcew-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /api/ {
        proxy_pass http://gvpcew-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /student { rewrite ^ /student.html last; }
    location = /faculty { rewrite ^ /faculty.html last; }
    location = /admin { rewrite ^ /admin.html last; }
    location = /academic-coordinator { rewrite ^ /academic-coordinator.html last; }
    location = /hod { rewrite ^ /hod.html last; }
    location = /student-coordinator { rewrite ^ /student-coordinator.html last; }
    location = /login { rewrite ^ /index.html last; }
    location = /register { rewrite ^ /index.html last; }
    location = /enroll { rewrite ^ /index.html last; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
