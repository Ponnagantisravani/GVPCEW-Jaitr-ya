<!doctype html><html lang="en"><meta charset="utf-8"><title>Responsive checks</title><body><pre id="results">Running</pre><div id="frames"></div><script>
const width=Number(new URLSearchParams(location.search).get('width'))||390;
const cases=[['student','Dashboard'],['faculty','Dashboard'],['admin','Dashboard'],['academic_coordinator','Dashboard'],['student_coordinator','Dashboard'],['student','Digital ID'],['student','Student Profile'],['student','Attendance'],['faculty','Attendance'],['faculty','Marks'],['faculty','Assignments'],['admin','Academic Management'],['admin','User Management'],['academic_coordinator','Academic Calendar'],['academic_coordinator','Timetable Management'],['academic_coordinator','Exam Schedule'],['academic_coordinator','Syllabus'],['student','Notifications'],['student','Mark Attendance']];
const results=[];window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data.kind!=='layout-result')return;results.push(e.data);document.getElementById('results').textContent=JSON.stringify({complete:results.length===cases.length,results});next();});
function next(){const item=cases[results.length];if(!item)return;const [role,screen]=item;document.getElementById('frames').replaceChildren();const frame=document.createElement('iframe');frame.width=width;frame.height=Number(new URLSearchParams(location.search).get('height'))||844;frame.style.border='0';frame.src='./preview.html?'+new URLSearchParams({role,screen});document.getElementById('frames').append(frame);}
next();</script></body></html>
