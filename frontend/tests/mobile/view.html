<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile visual preview</title><body style="margin:0;background:#f5f7f6"><iframe id="preview" style="border:0;display:block" title="Portal preview"></iframe><script>const p=new URLSearchParams(location.search);const f=document.getElementById('preview');f.width=p.get('width')||390;f.height=p.get('height')||844;f.src=(p.has('auth')?'./auth.html?':'./preview.html?')+p;window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data.kind==='layout-result')document.body.dataset.result=JSON.stringify(e.data);});</script></body></html>
