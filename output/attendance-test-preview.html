<div id="gvp-attendance-preview" class="viz-dotted-background">
  <div class="preview-controls">
    <label>Test account<select id="preview-account" class="cursor-interaction">
      <option value="sravani">Sravani · Coordinator · II CSE 3</option>
      <option value="sarvani">Sarvani · Coordinator · III CSE 2</option>
      <option value="student3">Demo student · II CSE 3</option>
      <option value="student2">Demo student · III CSE 2</option>
    </select></label>
    <label>Enrollment scenario<select id="preview-enrollment" class="cursor-interaction">
      <option value="ready">Approved on this phone</option>
      <option value="setup">First face registration</option>
      <option value="wrong-device">Device binding mismatch</option>
      <option value="pending">Awaiting approval</option>
    </select></label>
    <button id="preview-switch" class="preview-button cursor-interaction">Try student view</button>
  </div>
  <div class="preview-phone">
    <header class="preview-brand"><span class="preview-logo">G</span><div><strong>GVPCEW</strong><span>Attendance preview</span></div><span class="preview-tag">SIMULATED</span></header>
    <main id="preview-screen"></main>
    <footer>One account. One phone. Your attendance.</footer>
  </div>
</div>
<style>
#gvp-attendance-preview{--app-bg:light-dark(#f3f6fc,#111b2b);--app-panel:light-dark(#fff,#1b293b);--app-text:light-dark(#15233c,#edf3ff);--app-muted:light-dark(#57657a,#b8c6da);--app-blue:light-dark(#185adb,#477fee);--app-border:light-dark(#d5dfed,#3c506b);--app-soft:light-dark(#eaf0fb,#243b5b);--app-green:light-dark(#e2f5e9,#173f31);--app-green-text:light-dark(#17613a,#b2efcc);--app-warn:light-dark(#fff4d7,#423720);--app-warn-text:light-dark(#78510d,#ffe0a0);--app-on-blue:#fff;color:var(--app-text);font-family:system-ui,sans-serif;padding:16px 8px;}
#gvp-attendance-preview *{box-sizing:border-box;}
#gvp-attendance-preview .preview-controls{max-width:540px;margin:0 auto 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:end;}
#gvp-attendance-preview label{display:flex;flex-direction:column;gap:8px;min-width:0;}
#gvp-attendance-preview .preview-controls>label{flex:1 1 220px;}
#gvp-attendance-preview select,#gvp-attendance-preview input:not([type=checkbox]){font:inherit;color:var(--app-text);background:var(--app-panel);border:1px solid var(--app-border);border-radius:12px;padding:12px;width:100%;min-width:0;}
#gvp-attendance-preview button{font:inherit;min-height:44px;}
#gvp-attendance-preview .preview-button{background:var(--app-soft);color:var(--app-text);border:0;border-radius:12px;padding:12px 16px;}
#gvp-attendance-preview .preview-phone{width:100%;max-width:390px;margin:auto;padding:22px;background:var(--app-bg);border:1px solid var(--app-border);border-radius:28px;}
#gvp-attendance-preview .preview-brand{display:flex;align-items:center;gap:10px;margin:0 0 24px;flex-wrap:wrap;}
#gvp-attendance-preview .preview-brand strong{display:block;}
#gvp-attendance-preview .preview-brand span:not(.preview-logo){display:block;}
#gvp-attendance-preview .preview-logo{display:grid;place-items:center;min-width:48px;height:48px;border-radius:14px;background:var(--app-blue);color:var(--app-on-blue);font-weight:700;}
#gvp-attendance-preview .preview-tag{color:var(--app-muted);margin-left:auto;}
#gvp-attendance-preview .app-panel{background:var(--app-panel);padding:20px;border:1px solid var(--app-border);border-radius:22px;margin-top:18px;display:flex;flex-direction:column;gap:14px;}
#gvp-attendance-preview h2,#gvp-attendance-preview h3,#gvp-attendance-preview p{margin:0;}
#gvp-attendance-preview h2,#gvp-attendance-preview h3{font:inherit;font-weight:700;}
#gvp-attendance-preview p{color:var(--app-muted);line-height:1.55;}
#gvp-attendance-preview .app-account{display:flex;flex-direction:column;gap:7px;overflow-wrap:anywhere;}
#gvp-attendance-preview .app-primary,#gvp-attendance-preview .app-secondary{width:100%;padding:14px;border:0;border-radius:12px;font-weight:600;}
#gvp-attendance-preview .app-primary{background:var(--app-blue);color:var(--app-on-blue);}
#gvp-attendance-preview .app-secondary{background:var(--app-soft);color:var(--app-text);}
#gvp-attendance-preview button:disabled{opacity:.45;}
#gvp-attendance-preview .app-warning{background:var(--app-warn);color:var(--app-warn-text);padding:12px;border-radius:12px;}
#gvp-attendance-preview .app-success{background:var(--app-green);color:var(--app-green-text);padding:18px;border-radius:14px;font-weight:700;}
#gvp-attendance-preview .app-consent{display:flex;flex-direction:row;gap:10px;align-items:center;}
#gvp-attendance-preview footer{margin-top:20px;text-align:center;color:var(--app-muted);}
#gvp-attendance-preview .app-face{display:grid;place-items:center;padding:24px;background:var(--app-soft);border-radius:18px;gap:12px;}
#gvp-attendance-preview .app-face i{width:42px;height:42px;}
#gvp-attendance-preview .app-timer{font-weight:700;color:var(--app-blue);font-variant-numeric:tabular-nums;}
#gvp-attendance-preview .app-roster{margin:0;padding:0;list-style:none;}
#gvp-attendance-preview .app-roster li{padding:12px 0;border-bottom:1px solid var(--app-border);display:flex;flex-direction:column;gap:5px;overflow-wrap:anywhere;}
#gvp-attendance-preview .app-roster li:last-child{border-bottom:0;}
</style>
<script>
(()=>{
 const root=document.getElementById('gvp-attendance-preview');
 const screen=root.querySelector('#preview-screen'),picker=root.querySelector('#preview-account'),scenario=root.querySelector('#preview-enrollment'),switcher=root.querySelector('#preview-switch');
 const accounts={sravani:{name:'Sravani',email:'324103210170.sravani@gvpcew.ac.in',role:'coordinator',section:'II CSE · Section 3',key:'cse2-3'},sarvani:{name:'Sarvani',email:'324103210134.sarvani@gvpcew.ac.in',role:'coordinator',section:'III CSE · Section 2',key:'cse3-2'},student3:{name:'Demo student',email:'Demo account · II CSE 3',role:'student',section:'II CSE · Section 3',key:'cse2-3'},student2:{name:'Demo student',email:'Demo account · III CSE 2',role:'student',section:'III CSE · Section 2',key:'cse3-2'}};
 const demoStudents={'cse2-3':{roll:'DEMO20301',name:'Demo student · II CSE 3'},'cse3-2':{roll:'DEMO30201',name:'Demo student · III CSE 2'}};
 let signedIn=false,enrollment='ready',consent=false,resetConfirm=false,duration=60,faceStage='',notice='',sessions={},rollQuery='';
 const saved=window.openai?.widgetState;
 function restore(snapshot){const d=snapshot?.privateContent;if(!d||!accounts[d.account])return;picker.value=d.account;signedIn=!!d.signedIn;enrollment=['ready','setup','wrong-device','pending'].includes(d.enrollment)?d.enrollment:'ready';scenario.value=enrollment;duration=Number(d.duration)||60;sessions=d.sessions||{};faceStage='';notice='';}
 restore(saved);
 function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{account:accounts[picker.value].name,role:accounts[picker.value].role,section:accounts[picker.value].section,enrollment,sessionStarted:!!sessions[accounts[picker.value].key],studentMarked:!!sessions[accounts[picker.value].key]?.marked},privateContent:{account:picker.value,signedIn,enrollment,duration,sessions}}).catch(()=>{});}
 const btn=(id,text,secondary=false,disabled=false)=>'<button type="button" id="'+id+'" class="'+(secondary?'app-secondary':'app-primary')+' cursor-interaction" '+(disabled?'disabled':'')+'>'+text+'</button>';
 function bind(id,fn){const b=root.querySelector('#'+id);if(b)b.addEventListener('click',fn);}
 function change(fn){fn();render();persist();}
 function activeSession(){return sessions[accounts[picker.value].key]||null;}
 function rosterMarkup(){
  const a=accounts[picker.value],s=activeSession(),student=demoStudents[a.key],query=rollQuery.trim().toLowerCase();
  const matches=!query||student.roll.toLowerCase().includes(query);
  if(query)return matches?'<li><strong>'+student.roll+'</strong><span>'+student.name+'</span><span>'+(s?.marked?(s.late?'Present (Late)':'Present'):'Not marked')+'</span></li>':'<li>No student matches this roll number in the demo roster.</li>';
  return s?.marked?'<li><strong>'+student.roll+'</strong><span>'+student.name+'</span><span>'+(s.late?'Present (Late)':'Present')+'</span></li>':'<li>No students have been marked present yet.</li>';
 }
 function render(){
  const a=accounts[picker.value],s=activeSession(),remaining=s?Math.max(0,Math.ceil((s.expires-Date.now())/1000)):0;
  switcher.textContent=a.role==='coordinator'?'Try student view':'Try coordinator view';
  if(!signedIn){screen.innerHTML='<section class="app-panel"><h2>Attendance login</h2><label>College account<input readonly value="'+a.email+'"></label>'+btn('signin','Preview sign in')+'</section>';bind('signin',()=>change(()=>{signedIn=true;}));return;}
  let html='<div class="app-account"><strong>'+a.name+'</strong><p>'+a.email+'</p><h2>'+(a.role==='coordinator'?'Student coordinator attendance':'Student attendance')+'</h2></div>';
  if(enrollment==='setup'){
   html+='<section class="app-panel"><h3>Register your face</h3><p>One-time face registration on this phone.</p><label class="app-consent"><input id="consent" type="checkbox" '+(consent?'checked':'')+'>I consent to face enrollment.</label>'+btn('register','Register face · simulation',false,!consent)+'</section>';
  }else if(enrollment==='wrong-device'){
   html+='<section class="app-panel"><h3>Phone verification required</h3><p>This installation does not match your registered device.</p>';
   if(a.role==='coordinator'){html+=resetConfirm?'<p class="app-warning">Remove the old face registration and phone binding? Existing attendance records stay.</p>'+btn('confirmreset','Confirm reset')+btn('cancelreset','Cancel',true):btn('reset','Reset my face registration',true);}else html+='<p>Ask an administrator to reset your enrollment.</p>';
   html+='</section>';
  }else if(enrollment==='pending')html+='<section class="app-panel"><h3>Awaiting approval</h3><p>Attendance stays locked until enrollment is approved.</p></section>';
  else{
   html+='<section class="app-panel"><h3>'+(a.role==='coordinator'?'Start and manage attendance':'Mark your attendance')+'</h3><strong>'+a.section+'</strong>';
   if(a.role==='coordinator'){
    if(s&&remaining>0)html+='<p class="app-timer" id="sessiontimer">'+remaining+'s remaining</p><p>Bluetooth broadcasting</p><p>'+(s.marked?'1 present':'0 present')+' · Demo roster</p>'+btn('end','End session',true);
    else html+='<label>Attendance time limit (seconds)<input id="duration" type="number" min="30" max="1800" step="1" value="'+duration+'"></label><p>No subject or period selection.</p>'+btn('start','Start attendance');
   }else if(s?.marked)html+='<div class="app-success" role="status">Attendance marked</div><p>'+a.section+' · '+(s.late?'Present (Late)':'Present')+'</p>';
   else if(!s||Date.now()>=s.expires+120000)html+='<p>No attendance session is open for your class.</p>';
   else if(remaining>0){
    html+='<p class="app-timer" id="sessiontimer">'+remaining+'s remaining</p>';
    if(!s.bluetooth)html+='<p>Searching for classroom Bluetooth…</p>'+btn('detect','Simulate Bluetooth detection');
    else if(faceStage!=='capture')html+='<p>Bluetooth verified. Ready for your face check.</p>'+btn('face','Start face verification');
    else html+='<div class="app-face"><i data-lucide="scan-face" aria-hidden="true"></i><strong>Blink once in the front camera</strong><span>Simulated camera</span></div>'+btn('match','Simulate blink + face match')+btn('fail','Simulate face mismatch',true);
   }else html+='<p>The main session has closed. Late face check is available for two minutes.</p>'+btn('late','Simulate successful late face check');
   if(notice)html+='<p class="app-warning" role="alert">'+notice+'</p>';
   html+='</section>';
   if(a.role==='coordinator')html+='<section class="app-panel"><h3>Present students</h3><p>'+(s?.marked?'1 student marked':'0 students marked')+'</p><label>Enter roll number<input id="roll-search" type="search" placeholder="Search demo roll: '+demoStudents[a.key].roll+'" autocomplete="off"></label><ul id="present-roster" class="app-roster" aria-live="polite">'+rosterMarkup()+'</ul></section>';
  }
  html+='<div style="margin-top:18px">'+btn('signout','Sign out',true)+'</div>';screen.innerHTML=html;
  bind('signout',()=>change(()=>{signedIn=false;faceStage='';notice='';}));
  const c=root.querySelector('#consent');if(c)c.addEventListener('change',()=>change(()=>{consent=c.checked;}));
  bind('register',()=>change(()=>{enrollment='ready';scenario.value='ready';consent=false;}));
  bind('reset',()=>change(()=>{resetConfirm=true;}));bind('cancelreset',()=>change(()=>{resetConfirm=false;}));
  bind('confirmreset',()=>change(()=>{enrollment='setup';scenario.value='setup';resetConfirm=false;consent=false;}));
  const limit=root.querySelector('#duration');if(limit)limit.addEventListener('input',()=>{duration=Number(limit.value);root.querySelector('#start').disabled=!Number.isInteger(duration)||duration<30||duration>1800;});
  const rollField=root.querySelector('#roll-search');if(rollField){rollField.value=rollQuery;rollField.addEventListener('input',()=>{rollQuery=rollField.value;root.querySelector('#present-roster').innerHTML=rosterMarkup();});}
  bind('start',()=>change(()=>{if(!Number.isInteger(duration)||duration<30||duration>1800){notice='Choose 30 to 1800 seconds.';return;}sessions[a.key]={expires:Date.now()+duration*1000,marked:false,bluetooth:false};notice='';}));
  bind('end',()=>change(()=>{s.expires=Date.now();notice='';}));
  bind('detect',()=>change(()=>{s.bluetooth=true;notice='';}));bind('face',()=>change(()=>{faceStage='capture';notice='';}));
  bind('match',()=>change(()=>{if(s&&Date.now()<s.expires&&s.bluetooth){s.marked=true;faceStage='';notice='';}}));
  bind('fail',()=>change(()=>{faceStage='';notice='Face not recognized. No attendance was recorded. Try again.';}));
  bind('late',()=>change(()=>{if(s&&Date.now()>=s.expires&&Date.now()<s.expires+120000){s.marked=true;s.late=true;notice='';}}));
  if(window.lucide)window.lucide.createIcons();
 }
 picker.addEventListener('change',()=>change(()=>{signedIn=false;faceStage='';notice='';resetConfirm=false;rollQuery='';}));
 scenario.addEventListener('change',()=>change(()=>{enrollment=scenario.value;consent=false;resetConfirm=false;notice='';faceStage='';}));
 switcher.addEventListener('click',()=>change(()=>{const a=accounts[picker.value];picker.value=a.key==='cse2-3'?(a.role==='coordinator'?'student3':'sravani'):(a.role==='coordinator'?'student2':'sarvani');signedIn=true;enrollment='ready';scenario.value='ready';faceStage='';notice='';rollQuery='';}));
 window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
 setInterval(()=>{const s=activeSession(),timer=root.querySelector('#sessiontimer');if(timer&&s){const seconds=Math.max(0,Math.ceil((s.expires-Date.now())/1000));timer.textContent=seconds+'s remaining';if(seconds===0)render();}},1000);
 render();
})();
</script>
